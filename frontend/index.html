<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restore appearance before the first paint, even before React loads.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('eest-flow-theme') === 'oscuro' ? 'oscuro' : 'claro';
      } catch {
        document.documentElement.dataset.theme = 'claro';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EEST Flow, aplicación web privada para la organización interna de la EEST N.º 1."
    />
    <title>EEST Flow</title>
    <link rel="icon" href="eestn1logo.png" type="image/x-icon">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
